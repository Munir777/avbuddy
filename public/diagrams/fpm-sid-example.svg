  <text x="632" y="108" font-size="14" fill="#064">              121.300</text>
  <text x="632" y="126" font-size="14" fill="#064">ZULU TWR  118.300</text>
  <text x="632" y="144" font-size="14" fill="#064">ATIS  126.925</text>

  <!-- airport symbol -->
