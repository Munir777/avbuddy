<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="900" height="620" fill="#ffffff" stroke="#222" stroke-width="2"/>

  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">ZULU INTL (ZZZZ) — RWY 09 DEPARTURES — PENDA 1A</text>
