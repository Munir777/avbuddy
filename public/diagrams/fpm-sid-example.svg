  <g>
    <polygon points="800,320 815,330 810,347 790,347 785,330" fill="none" stroke="#0a3d91" stroke-width="2"/>
    <circle cx="800" cy="335" r="3" fill="#0a3d91"/>
    <text x="770" y="365" font-size="13" font-weight="bold" fill="#0a3d91">ZOL</text>
  </g>
  <line x1="800" y1="335" x2="610" y2="230" stroke="#0a3d91" stroke-width="1" stroke-dasharray="6,4"/>
  <rect x="694" y="278" width="42" height="16" fill="#fff"/>
  <text x="700" y="290" font-size="12" fill="#0a3d91">R210</text>

  <text x="450" y="600" text-anchor="middle" font-size="11" fill="#555">Not a real chart — invented waypoints, frequencies and airport for illustration only.</text>
