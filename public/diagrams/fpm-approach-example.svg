<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="900" height="620" fill="#ffffff" stroke="#222" stroke-width="2"/>

  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">ZULU INTL (ZZZZ) — ILS RWY 09 — EXAMPLE APPROACH CHART</text>
  <text x="450" y="50" text-anchor="middle" font-size="13" fill="#900">EXAMPLE CHART — invented airport/procedure, for illustration only</text>

  <!-- divider -->
  <line x1="450" y1="65" x2="450" y2="600" stroke="#999" stroke-width="1"/>
  <text x="225" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">PLAN VIEW</text>
  <text x="670" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">PROFILE VIEW</text>

  <!-- === PLAN VIEW (left) === -->
  <!-- terrain spot elevations -->
  <circle cx="90" cy="140" r="3" fill="#333"/>
  <text x="98" y="138" font-size="13" fill="#333">842</text>

  <circle cx="180" cy="200" r="3" fill="#333"/>
  <text x="188" y="198" font-size="13" fill="#333">956</text>

  <circle cx="130" cy="330" r="4" fill="#333"/>
  <text x="140" y="328" font-size="14" font-weight="bold" fill="#900">1187</text>

  <circle cx="290" cy="180" r="3" fill="#333"/>
  <text x="298" y="178" font-size="13" fill="#333">611</text>

  <circle cx="330" cy="380" r="3" fill="#333"/>
  <text x="338" y="378" font-size="13" fill="#333">704</text>

  <!-- runway -->
  <rect x="330" y="330" width="110" height="9" fill="#333" transform="rotate(-8 385 334)"/>
  <text x="335" y="352" font-size="13" fill="#111">RWY 09</text>

  <!-- tower box -->
  <rect x="60" y="420" width="150" height="60" fill="#eaf6ea" stroke="#0a6" stroke-width="1.5"/>
  <text x="68" y="440" font-size="13" fill="#064">ZULU TWR</text>
  <text x="68" y="458" font-size="13" fill="#064">118.300 ★</text>
  <text x="68" y="474" font-size="10.5" fill="#631">★ part-time — see hours</text>

  <!-- lighting note -->
  <rect x="240" y="420" width="180" height="44" fill="#f5f0ff" stroke="#66c" stroke-width="1.5"/>
  <text x="248" y="438" font-size="12.5" fill="#334">RWY 09 approach lighting:</text>
  <text x="248" y="455" font-size="12.5" font-weight="bold" fill="#334">SALS</text>

  <!-- === PROFILE VIEW (right) === -->
  <line x1="500" y1="480" x2="850" y2="480" stroke="#333" stroke-width="1.5"/>
  <text x="855" y="484" font-size="12" fill="#333">THR</text>

  <!-- descent line -->
  <line x1="520" y1="150" x2="840" y2="470" stroke="#111" stroke-width="2.5"/>

  <!-- Maltese cross at FAF -->
  <g transform="translate(600,290)">
    <polygon points="0,-11 5,-5 11,0 5,5 0,11 -5,5 -11,0 -5,-5" fill="#111"/>
  </g>
  <text x="615" y="290" font-size="13" font-weight="bold" fill="#111">FAF</text>
  <text x="500" y="260" font-size="12" fill="#333">(Maltese cross)</text>

  <!-- descent angle label -->
  <text x="660" y="380" font-size="14" font-weight="bold" fill="#111">3.2°</text>

  <!-- DA(H) box -->
  <rect x="600" y="500" width="160" height="46" fill="#fff4e0" stroke="#a66" stroke-width="1.5"/>
  <text x="608" y="520" font-size="13" fill="#631">DA(H)</text>
  <text x="608" y="538" font-size="13" font-weight="bold" fill="#631">620 ft (200 ft)</text>

  <text x="450" y="600" text-anchor="middle" font-size="11" fill="#555">Not a real chart — invented airport, terrain and values for illustration only.</text>
</svg>
